spring.application.name=virelo-payments
server.address=${VIRELO_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${VIRELO_DB_URL:jdbc:h2:file:./data/virelo}
spring.datasource.username=${VIRELO_DB_USER:sa}
spring.datasource.password=${VIRELO_DB_PASSWORD:}
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,metrics
virelo.seed=${VIRELO_SEED:true}
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
